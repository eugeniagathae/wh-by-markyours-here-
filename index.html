        return DEFAULT_FIREBASE_CONFIG;

    function initFirestore() {
      const cfg = getActiveFirebaseConfig();
      if (!cfg || !window.firebase) return null;
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(cfg);
        }
        return firebase.firestore();
      } catch (err) {
        console.error("Firebase init error:", err);
        return null;

    function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxW = 500;
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.55));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function formatIdr(num) {
      return "Rp " + Math.round(Number(num || 0)).toLocaleString("id-ID");
    }

    function computeSubmissionTotal(sub, tripConfig) {
      const cfg = tripConfig[sub.route] || { defaultRate: 180, yuanRate: 2200 };
      const totalGrams = (sub.items || []).reduce((acc, it) => acc + Number(it.weightGram || 0), 0);
      const rate = Number(sub.ratePerGram ?? cfg.defaultRate ?? 180);
      const extra = Number(sub.extraFee || 0);
      const totalIdr = totalGrams * rate + extra;
      if (sub.route === "indo-china" && sub.currency === "CNY") {
        const yRate = Number(cfg.yuanRate || 2200);
        return {
          totalGrams,
          rate,
          extra,
          totalIdr,
          displayTotal: totalIdr / yRate,
          currency: "CNY",
          paid: Number(sub.paidAmount || 0),
          remaining: Math.max(0, totalIdr - Number(sub.paidAmount || 0)),
        };
      }
      return {
        totalGrams,
        rate,
        extra,
        totalIdr,
        displayTotal: totalIdr,
        currency: "IDR",
        paid: Number(sub.paidAmount || 0),
        remaining: Math.max(0, totalIdr - Number(sub.paidAmount || 0)),
      };
    }

    function isNextTrip(sub, tripConfig) {
      if (sub.tripOverride === "ikut trip ini") return false;
      if (sub.tripOverride === "ikut next trip") return true;
      const cfg = tripConfig[sub.route];
      if (!cfg || !cfg.lastReceive) return false;
      const createdDay = (sub.createdAt || "").slice(0, 10);
      return createdDay > cfg.lastReceive;
    }

          ].map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",");

        const csv = [headers.join(","), ...rows].join("\n");

            if (parsed && Array.isArray(parsed.submissions)) {
              setDb(parsed);
              syncMetaToCloud(parsed.tripConfig || db.tripConfig, parsed.customers || db.customers);
              parsed.submissions.forEach((s) => syncSubmissionToCloud(s));
              setSyncStatusMsg("Backup JSON berhasil dimuat & disinkronkan ke Firebase!");
            } else {
              setSyncStatusMsg("Format JSON tidak valid.");

          } catch {
            setSyncStatusMsg("Gagal membaca file JSON.");
          }
        };
        reader.readAsText(file);

      const visibleSubmissions = useMemo(() => {
        if (!route || route === "usa-cargo" || !session) return [];
        let list = db.submissions.filter((s) => s.route === route);

        if (session.role === "customer") {
          list = list.filter((s) => s.customerCode === session.code);
        }

        if (searchResi.trim()) {
          const q = searchResi.trim().toLowerCase();
          list = list.filter(
            (s) =>
              (s.resi || "").toLowerCase().includes(q) ||
              (s.indoResi || "").toLowerCase().includes(q) ||
              (s.customerName || "").toLowerCase().includes(q) ||
              (s.items || []).some((it) => (it.name || "").toLowerCase().includes(q))
          );
        }

        if (filterCategory !== "all") {
          list = list.filter((s) => (s.items || []).some((it) => it.category === filterCategory));
        }

        if (filterStatus !== "all") {
          list = list.filter((s) => s.status === filterStatus);
        }

        if (session.role === "admin") {
          if (route === "china-indo" && filterCity !== "all") {
            list = list.filter((s) => s.city === filterCity);
          }
          if (filterCustomer !== "all") {
            list = list.filter((s) => s.customerName === filterCustomer);
          }
          if (filterUploader !== "all") {
            list = list.filter((s) => s.uploaderName === filterUploader);
          }
        }

        if (tripFilter === "active") {
          list = list.filter((s) => !isNextTrip(s, db.tripConfig));
        } else if (tripFilter === "next") {
          list = list.filter((s) => isNextTrip(s, db.tripConfig));
        }

        const sorted = [...list];
        if (sortBy === "alpha") {
          sorted.sort((a, b) => (a.customerName || "").localeCompare(b.customerName || "", "id"));
        } else if (sortBy === "city") {

        return sorted;

              totalGrams: 0,
              totalIdr: 0,
              paid: 0,
              remaining: 0,
              resiCount: 0,
              subs: [],

          entry.totalGrams += calc.totalGrams;

          entry.remaining += calc.remaining;

                                        {st.label} ({(sub.photos?.[st.key] || []).length})
                                      </div>
                                      {session.role === "admin" && (
                                        <input
                                          type="file"
                                          accept="image/*"
                                          multiple
                                          onChange={(e) => handleAdminStagePhotoUpload(sub.id, st.key, e.target.files)}
                                          className="text-[10px] w-full"
                                        />
                                      )}
                                      <div className="flex gap-1 mt-0.5">
                                        {(sub.photos?.[st.key] || []).map((src, i) => (
                                          <img key={i} src={src} alt={st.label} className="w-8 h-8 object-cover rounded border" />
                                        ))}
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              )}
                              {sub.lastAudit && (
                                <div className="text-[10px] text-gray-400 mt-1.5">{sub.lastAudit}</div>
                              )}
                            </td>

                            <td className="p-2.5 border border-melon-100 min-w-[130px] space-y-1.5">
                              {locked && (
                                <div className="text-[10px] text-amber-800 bg-sun-50 p-1.5 rounded border border-sun-200">
                                  🔒 {t.lockedNotice}
                                </div>
                              )}
                              <button
                                type="button"
                                onClick={() => { setChangeResiModal(sub.id); setNewResiInput(sub.resi || ""); }}
                                className="w-full py-1 px-2 rounded-lg bg-melon-100 hover:bg-melon-200 text-melon-500 font-bold text-[11px] cursor-pointer"
                              >
                                {t.changeResi}
                              </button>
                              <button
                                type="button"
                                onClick={() => {
                                  setReturModal(sub.id);
                                  setReturType(sub.returInfo?.type || "Retur CO Ulang");
                                  setReturNewResi(sub.returInfo?.newResi || "");
                                  setReturReason(sub.returInfo?.reason || "");
                                }}
                                className="w-full py-1 px-2 rounded-lg bg-sun-100 hover:bg-sun-200 text-amber-900 font-bold text-[11px] cursor-pointer"
                              >
                                {t.requestRetur}
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === "billing" && (
              <div className="bg-white/95 border-2 border-melon-200 rounded-3xl p-4 sm:p-6 shadow-lg space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <h2 className="font-display text-xl font-bold text-melon-500">{t.navBilling}</h2>
                  <div className="flex flex-wrap gap-2">
                    <button
                      type="button"
                      onClick={() => setBillingGroupByCustomer(true)}
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-bold cursor-pointer ${
                        billingGroupByCustomer ? "bg-melon-400 text-white" : "bg-melon-50 text-gray-700 border border-melon-200"
                      }`}
                    >
                      Gabung per Customer
                    </button>
                    <button
                      type="button"
                      onClick={() => setBillingGroupByCustomer(false)}
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-bold cursor-pointer ${
                        !billingGroupByCustomer ? "bg-melon-400 text-white" : "bg-melon-50 text-gray-700 border border-melon-200"
                      }`}
                    >
                      Per Barang
                    </button>
                  </div>
                </div>

                {billingGroupByCustomer ? (
                  <div className="overflow-x-auto sheet-scroll border border-melon-200 rounded-2xl">
                    <table className="min-w-full text-xs border-collapse">
                      <thead>
                        <tr className="bg-rind-100 text-gray-800 font-bold">
                          <th className="p-2.5 border border-melon-200 text-left">Customer</th>
                          <th className="p-2.5 border border-melon-200 text-left">Jumlah Resi</th>
                          <th className="p-2.5 border border-melon-200 text-left">Total Berat (g)</th>
                          <th className="p-2.5 border border-melon-200 text-left">Total Tagihan</th>
                          <th className="p-2.5 border border-melon-200 text-left">DP / Dibayar</th>
                          <th className="p-2.5 border border-melon-200 text-left">Sisa Tagihan</th>
                          <th className="p-2.5 border border-melon-200 text-left">Salin Struk</th>
                        </tr>
                      </thead>
                      <tbody>
                        {aggregatedBillingByCustomer.map((grp) => {
                          const yRate = Number(db.tripConfig["indo-china"]?.yuanRate || 2200);
                          const isCny = route === "indo-china" && grp.currency === "CNY";
                          const fmtAmt = (idrVal) =>
                            isCny ? `¥ ${(idrVal / yRate).toFixed(2)}` : formatIdr(idrVal);

                          const receiptText = [
                            `WH By Markyours_here (${routeTitle})`,
                            `Customer: ${grp.customerName} (${grp.customerCode})`,
                            ...grp.subs.map(({ sub, calc }) =>
                              `- ${sub.resi || "No Resi"} | ${(sub.items || []).map((i) => i.name).join(", ")} | ${calc.totalGrams}g | ${formatIdr(calc.totalIdr)}`
                            ),
                            `Total Berat: ${grp.totalGrams}g`,
                            `Total Tagihan: ${fmtAmt(grp.totalIdr)} (${formatIdr(grp.totalIdr)})`,
                            `DP / Dibayar: ${formatIdr(grp.paid)}`,
                            `Sisa Tagihan: ${formatIdr(grp.remaining)}`,
                          ].join("\n");

                          return (
                            <tr key={grp.key} className="odd:bg-white even:bg-melon-50/30">
                              <td className="p-2.5 border border-melon-100 font-bold">
                                {grp.customerName} <span className="text-[11px] text-gray-500">({grp.customerCode})</span>
                              </td>
                              <td className="p-2.5 border border-melon-100">{grp.resiCount}</td>
                              <td className="p-2.5 border border-melon-100">{grp.totalGrams} g</td>
                              <td className="p-2.5 border border-melon-100 font-bold text-melon-500">
                                {fmtAmt(grp.totalIdr)}
                                {isCny && <div className="text-[10px] text-gray-500">({formatIdr(grp.totalIdr)})</div>}
                              </td>
                              <td className="p-2.5 border border-melon-100">{formatIdr(grp.paid)}</td>
                              <td className="p-2.5 border border-melon-100 font-bold text-amber-800">{formatIdr(grp.remaining)}</td>
                              <td className="p-2.5 border border-melon-100">
                                <button
                                  type="button"
                                  onClick={() => copyReceiptText(grp.key, receiptText)}
                                  className="px-3 py-1 rounded-lg bg-melon-100 hover:bg-melon-200 text-melon-500 font-bold cursor-pointer"
                                >
                                  {copiedKey === grp.key ? t.copied : t.copyReceipt}
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <div className="overflow-x-auto sheet-scroll border border-melon-200 rounded-2xl">
                    <table className="min-w-full text-xs border-collapse">
                      <thead>
                        <tr className="bg-melon-100 text-gray-800 font-bold">
                          <th className="p-2.5 border border-melon-200 text-left">Customer / Resi</th>
                          <th className="p-2.5 border border-melon-200 text-left">Berat (g)</th>
                          <th className="p-2.5 border border-melon-200 text-left">Tarif/g (IDR)</th>
                          <th className="p-2.5 border border-melon-200 text-left">Biaya Tambahan</th>
                          {route === "indo-china" && (
                            <th className="p-2.5 border border-melon-200 text-left">Mata Uang</th>
                          )}
                          <th className="p-2.5 border border-melon-200 text-left">Total Tagihan</th>
                          <th className="p-2.5 border border-melon-200 text-left">DP / Dibayar</th>
                          <th className="p-2.5 border border-melon-200 text-left">Sisa &amp; Status Bayar</th>
                        </tr>
                      </thead>
                      <tbody>
                        {visibleSubmissions.map((sub) => {
                          const calc = computeSubmissionTotal(sub, db.tripConfig);
                          const yRate = Number(db.tripConfig["indo-china"]?.yuanRate || 2200);
                          return (
                            <tr key={sub.id} className="odd:bg-white even:bg-melon-50/30">
                              <td className="p-2.5 border border-melon-100">
                                <div className="font-bold">{sub.customerName}</div>
                                <div className="text-[11px] text-gray-500">{sub.resi || "(No Resi)"}</div>
                              </td>
                              <td className="p-2.5 border border-melon-100">
                                {session.role === "admin" ? (
                                  <input
                                    type="number"
                                    value={sub.items?.[0]?.weightGram ?? 0}
                                    onChange={(e) => {
                                      const val = Number(e.target.value || 0);
                                      updateSubmission(sub.id, (prev) => ({
                                        items: (prev.items || []).map((it, idx) =>
                                          idx === 0 ? { ...it, weightGram: val } : it
                                        ),
                                      }));
                                    }}
                                    className="w-20 px-2 py-1 rounded border border-melon-200 bg-white"
                                  />
                                ) : (
                                  `${calc.totalGrams} g`
                                )}
                              </td>
                              <td className="p-2.5 border border-melon-100">
                                {session.role === "admin" ? (
                                  <input
                                    type="number"
                                    value={sub.ratePerGram ?? calc.rate}
                                    onChange={(e) => updateSubmission(sub.id, { ratePerGram: Number(e.target.value || 0) })}
                                    className="w-20 px-2 py-1 rounded border border-melon-200 bg-white"
                                  />
                                ) : (
                                  formatIdr(calc.rate)
                                )}
                              </td>
                              <td className="p-2.5 border border-melon-100">
                                {session.role === "admin" ? (
                                  <input
                                    type="number"
                                    value={sub.extraFee ?? 0}
                                    onChange={(e) => updateSubmission(sub.id, { extraFee: Number(e.target.value || 0) })}
                                    className="w-24 px-2 py-1 rounded border border-melon-200 bg-white"
                                  />
                                ) : (
                                  formatIdr(calc.extra)
                                )}
                              </td>
                              {route === "indo-china" && (
                                <td className="p-2.5 border border-melon-100">
                                  {session.role === "admin" ? (
                                    <select
                                      value={sub.currency || "IDR"}
                                      onChange={(e) => updateSubmission(sub.id, { currency: e.target.value })}
                                      className="px-2 py-1 rounded border border-melon-200 bg-white"
                                    >
                                      <option value="IDR">IDR</option>
                                      <option value="CNY">CNY (Yuan)</option>
                                    </select>
                                  ) : (
                                    sub.currency || "IDR"
                                  )}
                                </td>
                              )}
                              <td className="p-2.5 border border-melon-100 font-bold text-melon-500">
                                {route === "indo-china" && sub.currency === "CNY"
                                  ? `¥ ${(calc.totalIdr / yRate).toFixed(2)}`
                                  : formatIdr(calc.totalIdr)}
                              </td>
                              <td className="p-2.5 border border-melon-100">
                                {session.role === "admin" ? (
                                  <input
                                    type="number"
                                    value={sub.paidAmount ?? 0}
                                    onChange={(e) => updateSubmission(sub.id, { paidAmount: Number(e.target.value || 0) })}
                                    className="w-24 px-2 py-1 rounded border border-melon-200 bg-white"
                                  />
                                ) : (
                                  formatIdr(calc.paid)
                                )}
                              </td>
                              <td className="p-2.5 border border-melon-100">
                                <div className="font-bold">{formatIdr(calc.remaining)}</div>
                                {session.role === "admin" ? (
                                  <select
                                    value={sub.paymentStatus || "Belum Lunas"}
                                    onChange={(e) => updateSubmission(sub.id, { paymentStatus: e.target.value })}
                                    className="mt-1 px-2 py-0.5 rounded border border-melon-200 bg-white text-[11px]"
                                  >
                                    <option value="Belum Lunas">Belum Lunas</option>
                                    <option value="DP">DP</option>
                                    <option value="Lunas">Lunas</option>
                                  </select>
                                ) : (
                                  <span className="text-[11px] text-gray-600">{sub.paymentStatus}</span>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {activeTab === "trip" && session.role === "admin" && (
              <div className="bg-white/95 border-2 border-melon-200 rounded-3xl p-5 sm:p-7 shadow-lg space-y-4 max-w-xl">
                <h2 className="font-display text-xl font-bold text-melon-500">{t.navTrip} ({routeTitle})</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Tanggal Last Terima</label>
                    <input
                      type="date"
                      value={currentTripCfg.lastReceive || ""}
                      onChange={(e) => {
                        const nextTrip = {
                          ...db.tripConfig,
                          [route]: { ...db.tripConfig[route], lastReceive: e.target.value },
                        };
                        setDb((prev) => ({ ...prev, tripConfig: nextTrip }));
                        syncMetaToCloud(nextTrip, db.customers);
                      }}
                      className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm bg-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Tanggal Berangkat</label>
                    <input
                      type="date"
                      value={currentTripCfg.departDate || ""}
                      onChange={(e) => {
                        const nextTrip = {
                          ...db.tripConfig,
                          [route]: { ...db.tripConfig[route], departDate: e.target.value },
                        };
                        setDb((prev) => ({ ...prev, tripConfig: nextTrip }));
                        syncMetaToCloud(nextTrip, db.customers);
                      }}
                      className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm bg-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Tarif Default / gram (IDR)</label>
                    <input
                      type="number"
                      value={currentTripCfg.defaultRate ?? 180}
                      onChange={(e) => {
                        const nextTrip = {
                          ...db.tripConfig,
                          [route]: { ...db.tripConfig[route], defaultRate: Number(e.target.value || 0) },
                        };
                        setDb((prev) => ({ ...prev, tripConfig: nextTrip }));
                        syncMetaToCloud(nextTrip, db.customers);
                      }}
                      className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm bg-white"
                    />
                  </div>
                  {route === "indo-china" && (
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">Kurs Yuan (1 CNY = ... IDR)</label>
                      <input
                        type="number"
                        value={currentTripCfg.yuanRate ?? 2200}
                        onChange={(e) => {
                          const nextTrip = {
                            ...db.tripConfig,
                            [route]: { ...db.tripConfig[route], yuanRate: Number(e.target.value || 1) },
                          };
                          setDb((prev) => ({ ...prev, tripConfig: nextTrip }));
                          syncMetaToCloud(nextTrip, db.customers);
                        }}
                        className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm bg-white"
                      />
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {changeResiModal && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full border-2 border-melon-200 space-y-4">
                <h3 className="font-display text-lg font-bold text-melon-500">{t.changeResi}</h3>
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">{t.oldResi}</label>
                  <div className="px-3 py-2 rounded-xl bg-gray-100 text-xs font-semibold">
                    {db.submissions.find((s) => s.id === changeResiModal)?.resi || "(Kosong)"}
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">{t.newResi}</label>
                  <input
                    type="text"
                    value={newResiInput}
                    onChange={(e) => setNewResiInput(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm"
                  />
                </div>
                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setChangeResiModal(null)}
                    className="px-4 py-2 rounded-xl bg-gray-100 text-xs font-bold"
                  >
                    Batal
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmChangeResi}
                    className="px-4 py-2 rounded-xl bg-melon-400 text-white text-xs font-bold"
                  >
                    {t.saveResi}
                  </button>
                </div>
              </div>
            </div>
          )}

          {returModal && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full border-2 border-melon-200 space-y-4">
                <h3 className="font-display text-lg font-bold text-melon-500">{t.requestRetur}</h3>
                <div className="flex gap-2">
                  {["Retur CO Ulang", "Retur & Refund"].map((rt) => (
                    <button
                      key={rt}
                      type="button"
                      onClick={() => setReturType(rt)}
                      className={`flex-1 py-2 px-2 rounded-xl text-xs font-bold border ${
                        returType === rt ? "bg-melon-400 text-white border-melon-400" : "bg-white border-melon-200"
                      }`}
                    >
                      {rt}
                    </button>
                  ))}
                </div>
                {returType === "Retur CO Ulang" && (
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">{t.returNewResi}</label>
                    <input
                      type="text"
                      value={returNewResi}
                      onChange={(e) => setReturNewResi(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm"
                    />
                  </div>
                )}
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">{t.returReason}</label>
                  <textarea
                    rows={2}
                    value={returReason}
                    onChange={(e) => setReturReason(e.target.value)}
                    placeholder={returType === "Retur & Refund" ? "Keterangan tidak jadi..." : "Catatan retur..."}
                    className="w-full px-3 py-2 rounded-xl border border-melon-200 text-sm"
                  />
                </div>
                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setReturModal(null)}
                    className="px-4 py-2 rounded-xl bg-gray-100 text-xs font-bold"
                  >
                    Batal
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmRetur}
                    className="px-4 py-2 rounded-xl bg-melon-400 text-white text-xs font-bold"
                  >
                    {t.saveRetur}
                  </button>
                </div>
              </div>
            </div>
          )}

          {showSyncModal && session.role === "admin" && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full border-2 border-melon-200 space-y-4">
                <h3 className="font-display text-lg font-bold text-melon-500">☁️ Sync &amp; Backup</h3>
                <div className="text-xs p-2.5 rounded-xl bg-melon-50 border border-melon-200">
                  Status Firebase: <strong>{cloudStatus.toUpperCase()}</strong>
                  {cloudErrorDetail && <div className="text-red-600 mt-1">{cloudErrorDetail}</div>}
                </div>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={exportJsonBackup}
                    className="flex-1 py-2 px-3 rounded-xl bg-rind-100 text-rind-500 text-xs font-bold cursor-pointer"
                  >
                    Download JSON
                  </button>
                  <label className="flex-1 py-2 px-3 rounded-xl bg-melon-100 text-melon-500 text-xs font-bold text-center cursor-pointer">
                    Import JSON
                    <input type="file" accept=".json" onChange={handleImportJson} className="hidden" />
                  </label>
                </div>
                <button
                  type="button"
                  onClick={pushLocalDataToCloud}
                  className="w-full py-2 rounded-xl bg-rind-500 text-white text-xs font-bold cursor-pointer"
                >
                  ⬆️ Upload Data Lokal ke Firebase Sekarang
                </button>
                <div>
                  <label className="block text-xs font-bold text-gray-700 mb-1">Override Firebase Config JSON (Opsional)</label>
                  <textarea
                    rows={4}
                    value={fbConfigText}
                    onChange={(e) => setFbConfigText(e.target.value)}
                    placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'
                    className="w-full px-3 py-2 rounded-xl border border-melon-200 text-xs font-mono"
                  />
                  <button
                    type="button"
                    onClick={saveFirebaseConfig}
                    className="mt-2 w-full py-2 rounded-xl bg-melon-400 text-white text-xs font-bold cursor-pointer"
                  >
                    Simpan Firebase Config
                  </button>
                </div>
                {syncStatusMsg && <p className="text-xs font-semibold text-rind-500">{syncStatusMsg}</p>}
                <button
                  type="button"
                  onClick={() => { setShowSyncModal(false); setSyncStatusMsg(""); }}
                  className="w-full py-2 rounded-xl bg-gray-100 text-gray-700 text-xs font-bold"
                >
                  Tutup
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
